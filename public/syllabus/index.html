<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clean Plate Recipes syllabus</title>
<meta name="description" content="The Clean Plate Recipes cooking course as a homeschool course: objectives, units, skills, hours, pacing, assessment, and a suggested credit.">
<link rel="icon" href="/img/logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/demo.css">
<style>
  .syl{max-width:820px}
  .syl h2{margin-top:30px}
  .syl table{border-collapse:collapse;width:100%;font-size:15px}
  .syl th,.syl td{text-align:left;padding:7px 8px 7px 0;border-bottom:1px solid var(--h-line);vertical-align:top}
  .syl th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--h-mut)}
  .syl .scroll{overflow-x:auto}
  .syl ul{padding-left:1.2em}
  .syl li{margin:4px 0}
  .credit{background:var(--h-card);border:2px solid var(--h-acc);border-radius:12px;padding:14px 16px;margin:12px 0}
  .credit b{font-family:var(--h-disp);font-size:22px}
  @media print{
    :root{--h-bg:#fff;--h-fg:#000;--h-mut:#444;--h-line:#ccc;--h-card:#fff}
    .noprint{display:none!important}
    .wrap{padding:0;max-width:none}
    h2{break-after:avoid}
    tr,.credit{break-inside:avoid}
  }
</style>
</head>
<body>
<main id="syllabus" class="wrap syl"></main>
<script type="module" src="/syllabus.js"></script>
</body>
</html>
